[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-sdk"
version = "0.0.13"
description = "SDK-first NetBox toolkit with Python SDK, CLI, MCP server, and Textual TUIs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11,<3.14"
authors = [
  { name = "Emerson Felipe", email = "emerson@netdevopsbr.com" }
]
maintainers = [
  {name = "Emerson Felipe", email = "emerson@netdevopsbr.com"}
]
keywords = ["netbox", "terminal", "netbox-integration", "tui", "cli", "terminal", "api", "integration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "aiohttp>=3.13.4",
  "pydantic==2.13.3",
  "email-validator>=2.3.0",
  "jsonschema>=4.26.0,<5",
  "rich>=14.3.3",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
sdk = []
tui = ["textual>=8.2.0"]
# ``netbox_cli`` imports the standalone ``click`` package directly (exception
# formatting, ClickException/UsageError/Abort handling). Typer vendored Click in
# 0.26.0 and dropped its runtime dependency on the standalone package, so
# ``click`` must be declared explicitly or ``nbx`` breaks with ModuleNotFoundError.
cli = ["typer>=0.24.1", "click>=8.1.0"]
mcp = ["mcp>=1.23.0,<2"]
demo = ["playwright>=1.58.0"]
mock = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "starlette>=1.0.1",
]
# netbox-branching plugin support. Marker-only: branching uses the core
# aiohttp transport, so no additional runtime dependencies are required.
# Install with `pip install netbox-sdk[branching]` to opt in semantically.
branching = []
otel = [
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
]
all = [
  "textual>=8.2.0",
  "typer>=0.24.1",
  "click>=8.1.0",
  "playwright>=1.58.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "starlette>=1.0.1",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "mcp>=1.23.0,<2",
]
dev = [
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.8",
  "ty>=0.0.1a16",
  "pyright>=1.1.380",
  "textual>=8.2.0",
  "typer>=0.24.1",
  "click>=8.1.0",
  "playwright>=1.58.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "starlette>=1.0.1",
  "httpx>=0.27.0",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "mcp>=1.23.0,<2",
  "datamodel-code-generator==0.55.0",
]
docs = [
  "mkdocs-material>=9.7.6",
  "mkdocs-static-i18n[material]>=1.3.0",
]
[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-timeout>=2.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.15.8",
  "ty>=0.0.1a16",
  "pyright>=1.1.380",
  "textual>=8.2.0",
  "typer>=0.24.1",
  "click>=8.1.0",
  "playwright>=1.58.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "starlette>=1.0.1",
  "httpx>=0.27.0",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "mcp>=1.23.0,<2",
  "datamodel-code-generator==0.55.0",
]
docs = [
  "mkdocs-material>=9.7.6",
  "mkdocs-static-i18n[material]>=1.3.0",
]
publish = [
  "build==1.5.0",
  "packaging==26.0",
  "setuptools==83.0.0",
  "twine==6.2.0",
  "wheel==0.46.2",
]

[project.scripts]
nbx = "netbox_cli:main"
nbx-mock = "netbox_sdk.mock_main:run"
nbx-mcp = "netbox_mcp:run"

[project.urls]
Homepage = "https://github.com/emersonfelipesp/netbox-sdk"
Documentation = "https://emersonfelipesp.github.io/netbox-sdk/"
Repository = "https://github.com/emersonfelipesp/netbox-sdk"
Issues = "https://github.com/emersonfelipesp/netbox-sdk/issues"
Changelog = "https://github.com/emersonfelipesp/netbox-sdk/releases"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_sdk*", "netbox_tui*", "netbox_cli*", "netbox_mcp*"]

[tool.setuptools.package-data]
netbox_sdk = [
  "reference/openapi/*.json",
  "django_models/model_builds/*.json",
  "py.typed",
]
netbox_cli = ["py.typed"]
netbox_tui = ["*.tcss", "themes/*.json", "py.typed"]
netbox_mcp = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -n auto"
timeout = 60
markers = [
  "suite_sdk: tests owned by the standalone netbox_sdk package",
  "suite_cli: tests owned by the optional netbox_cli package",
  "suite_tui: tests owned by the optional netbox_tui package",
  "suite_mcp: tests owned by the optional netbox_mcp package",
  "live: tests that require a live NetBox instance (skipped when NETBOX_URL is absent)",
  "demo_live: tests that run live against demo.netbox.dev (skipped when NETBOX_DEMO_LIVE=1 is not set)",
  "slow: tests that build or install a distribution and take tens of seconds",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "ANN201",
  "ANN202",
  "ANN204",
  "E",
  "F",
  "I",
  "UP",
  "W",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["netbox_sdk", "netbox_tui", "netbox_cli", "netbox_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
"examples/**/*.py" = ["ANN"]
"netbox_sdk/typed_versions/*.py" = ["F403", "F405", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.src]
exclude = [
  "netbox_sdk/models/**",
  "netbox_sdk/typed_versions/**",
]

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
all = "ignore"

[tool.pyright]
include = ["netbox_sdk", "netbox_cli", "netbox_tui", "netbox_mcp"]
exclude = [
  "netbox_sdk/models/**",
  "netbox_sdk/typed_versions/**",
  "tests/**",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportAssignmentType = "warning"
reportRedeclaration = "warning"
reportInvalidTypeArguments = "warning"
