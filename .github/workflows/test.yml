name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  changes:
    name: detect test scope
    runs-on: ubuntu-latest
    outputs:
      run_all: ${{ steps.filter.outputs.run_all }}
      docs: ${{ steps.filter.outputs.docs }}
      sdk: ${{ steps.filter.outputs.sdk }}
      cli: ${{ steps.filter.outputs.cli }}
      tui: ${{ steps.filter.outputs.tui }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            run_all:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/conftest.py'
              - '.github/workflows/test.yml'
              - '.github/workflows/main-post-merge.yml'
              - '.github/workflows/publish-metadata.yml'
              - '.github/workflows/publish-testpypi.yml'
              - 'scripts/build_metadata.py'
              - 'scripts/release_policy.py'
              - 'tests/test_release_policy.py'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'README.md'
              - 'CLAUDE.md'
              - 'AGENTS.md'
              - 'CERTIFICATION.md'
              - 'llms.txt'
              - 'tests/test_docs_alignment.py'
              # tests/test_certification_readiness.py is deliberately NOT listed:
              # it carries no ownership marker, so `-m suite_sdk` does not collect
              # it and routing here would imply coverage this filter cannot give.
              # certification.yml already runs it unconditionally on every push
              # and pull request, and .gitea/workflows/ci.yml runs it too.
            sdk:
              - 'netbox_sdk/**'
              - 'scripts/generate_typed_sdk.py'
              - 'scripts/prepare_testpypi_upload.py'
              - 'tests/test_api_auth.py'
              - 'tests/test_api_cache.py'
              - 'tests/test_config_profiles.py'
              - 'tests/test_demo_auth.py'
              - 'tests/test_logging_runtime.py'
              - 'tests/test_mock_api.py'
              - 'tests/test_output_safety.py'
              - 'tests/test_plugin_discovery.py'
              - 'tests/test_branching_typed.py'
              - 'tests/test_release_line_coverage.py'
              - 'tests/test_release_registry.py'
              - 'tests/test_schema_resolution.py'
              - 'tests/test_schema_version_detection.py'
              - 'tests/test_schema_index.py'
              - 'tests/test_docs_alignment.py'
              - 'tests/test_return_annotations.py'
              - 'tests/test_sdk_completeness.py'
              - 'tests/test_sdk_imports.py'
              - 'tests/test_sdk_pynetbox_parity.py'
              - 'tests/test_services.py'
              - 'tests/test_typed_sdk.py'
              - 'tests/test_typed_generation.py'
              - 'tests/test_live_netbox.py'
              - 'tests/test_security_sdk.py'
            cli:
              - 'netbox_cli/**'
              - 'tests/test_cli_error_handling.py'
              - 'tests/test_cli_new_options.py'
              - 'tests/test_cli_trace.py'
              - 'tests/test_demo_cli.py'
              - 'tests/test_demo_runtime_refresh.py'
              - 'tests/test_docgen_paths.py'
              - 'tests/test_graphql.py'
              - 'tests/test_instance_isolation.py'
              - 'tests/test_markdown_output.py'
              - 'tests/test_security_cli.py'
            tui:
              - 'netbox_tui/**'
              - 'tests/test_cli_tui.py'
              - 'tests/test_cli_tui_theme.py'
              - 'tests/test_dev_tui.py'
              - 'tests/test_django_model_tui.py'
              - 'tests/test_logo_render.py'
              - 'tests/test_logs_tui.py'
              - 'tests/test_no_hardcoded_colors.py'
              - 'tests/test_theme_registry.py'
              - 'tests/test_tui_interaction.py'
              - 'tests/test_security_tui.py'
            mcp:
              - 'netbox_mcp/**'
              - 'tests/test_mcp.py'
              - 'scripts/check_nbx_write.py'
              - '.claude/settings.json'
              - '.claude/skills/**'
              - '.codex/hooks.json'
              - '.codex/skills/**'

  # ------------------------------------------------------------------ #
  # Branch / PR jobs — offline mock suites selected by changed paths    #
  # ------------------------------------------------------------------ #

  test-sdk:
    name: sdk suite / Python ${{ matrix.python-version }}
    needs: changes
    # Also gated on docs: tests/test_docs_alignment.py is suite_sdk-marked, and a
    # documentation-only change previously matched no filter at all, so the guard
    # that catches a stale support inventory never ran on the pull requests most
    # likely to create one.
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') && needs.changes.outputs.run_all != 'true' && (needs.changes.outputs.sdk == 'true' || needs.changes.outputs.docs == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Run netbox_sdk suite (with mock API)
        run: uv run pytest -v --tb=short -p no:randomly -m suite_sdk

  test-cli:
    name: cli suite / Python ${{ matrix.python-version }}
    needs: changes
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') && needs.changes.outputs.run_all != 'true' && needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Run netbox_cli suite
        run: uv run pytest -v --tb=short -p no:randomly -m suite_cli

  test-tui:
    name: tui suite / Python ${{ matrix.python-version }}
    needs: changes
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') && needs.changes.outputs.run_all != 'true' && needs.changes.outputs.tui == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Run netbox_tui suite
        run: uv run pytest -v --tb=short -p no:randomly -m suite_tui

  test-mcp:
    name: mcp suite / Python ${{ matrix.python-version }}
    needs: changes
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') && needs.changes.outputs.run_all != 'true' && needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Run netbox_mcp suite
        run: uv run pytest -v --tb=short -p no:randomly -m suite_mcp

  test-all-mock:
    name: full suite / mock API / Python ${{ matrix.python-version }}
    needs: changes
    if: ${{ !(github.event_name == 'push' && github.ref_name == 'main') && needs.changes.outputs.run_all == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Run full test suite (mock API)
        run: uv run pytest -v --tb=short -p no:randomly

  # ------------------------------------------------------------------ #
  # bundled release-line matrix                                          #
  #                                                                      #
  # One job per REGISTERED NetBox release line, so every bundled line is #
  # named in CI output. The full mocked suite already exercises these    #
  # tests transitively, but nothing named a specific line, so a change   #
  # that dropped a line's coverage produced no visible signal.           #
  #                                                                      #
  # This matrix needs no live NetBox: it pins the SDK to each bundled    #
  # line and runs the version-sensitive suites against the bundled       #
  # schema. Keep the list in sync with                                   #
  # netbox_sdk.versioning.SUPPORTED_NETBOX_VERSIONS —                    #
  # tests/test_release_line_coverage.py fails if it drifts.              #
  # ------------------------------------------------------------------ #

  test-bundled-release-lines:
    name: bundled NetBox ${{ matrix.bundled-netbox-version }} / Python 3.11
    needs: changes
    # Also gated on cli/mcp: the parity step imports netbox_cli.runtime and
    # netbox_mcp.service, so a change to either consumer must re-run it.
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || needs.changes.outputs.run_all == 'true' || needs.changes.outputs.sdk == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.mcp == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundled-netbox-version: ["4.3", "4.4", "4.5", "4.6", "4.7"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Run version-sensitive suites pinned to NetBox ${{ matrix.bundled-netbox-version }}
        env:
          NETBOX_SDK_NETBOX_VERSION: ${{ matrix.bundled-netbox-version }}
          NETBOX_MOCK_VERSION: ${{ matrix.bundled-netbox-version }}
        run: |
          uv run pytest -v --tb=short -p no:randomly \
            tests/test_release_line_coverage.py \
            tests/test_release_registry.py \
            tests/test_typed_sdk.py \
            tests/test_typed_generation.py \
            tests/test_branching_typed.py \
            tests/test_mock_api.py \
            tests/test_schema_resolution.py \
            tests/test_schema_version_detection.py \
            tests/test_docs_alignment.py

      - name: Verify the pinned line resolves identically on every surface
        env:
          NETBOX_SDK_NETBOX_VERSION: ${{ matrix.bundled-netbox-version }}
        run: |
          uv run python - <<'PY'
          import os
          from netbox_cli import runtime
          from netbox_mcp.service import NetBoxMCPService
          from netbox_sdk.config import Config
          from netbox_sdk.schema_resolution import (
              _clear_bundled_index_cache,
              requested_netbox_version,
          )

          pinned = os.environ["NETBOX_SDK_NETBOX_VERSION"]
          _clear_bundled_index_cache()
          cli = runtime._get_registration_index()
          _clear_bundled_index_cache()
          mcp = NetBoxMCPService(
              config_loader=lambda: Config(base_url="https://netbox.example.com"),
              allow_mutations=False,
              pinned_line=requested_netbox_version(),
          )
          assert set(cli.schema["paths"]) == set(mcp.index.schema["paths"]), (
              "CLI and MCP resolved different schemas for the same pin"
          )
          assert cli.schema["info"]["version"].startswith(pinned), cli.schema["info"]["version"]
          print(f"NetBox {pinned}: CLI and MCP agree on {len(cli.schema['paths'])} paths")
          PY

  # ------------------------------------------------------------------ #
  # main mock suite + SDK-affected branch/PR and main live matrix        #
  # ------------------------------------------------------------------ #

  test-all-mock-main:
    name: full suite / mock API / Python ${{ matrix.python-version }} [main]
    needs: changes
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Run full test suite (mock API)
        run: uv run pytest -v --tb=short -p no:randomly

  test-live-netbox:
    name: live NetBox ${{ matrix.netbox-version }} / Python 3.11
    env:
      NETBOX_EXPECTED_VERSION: ${{ matrix.netbox-version }}
    needs: changes
    if: ${{ (github.event_name == 'push' && github.ref_name == 'main') || needs.changes.outputs.run_all == 'true' || needs.changes.outputs.sdk == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        netbox-version: ["v4.5.10", "v4.6.2", "v4.6.3", "v4.6.6", "v4.7.0-beta2"]
    # Only postgres and redis as service containers — netbox is started
    # manually in a step so postgres is healthy before netbox connects.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: netbox
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netbox"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Set up Python 3.13 for source NetBox fallback
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Start NetBox container
        # postgres and redis are healthy before this step runs (GitHub Actions
        # guarantees service container health before starting steps).
        # Use --network host so the container reaches localhost:5432 / :6379.
        run: |
          set -euo pipefail

          image="ghcr.io/netbox-community/netbox:${{ matrix.netbox-version }}"
          # Preview tags move; pin the beta2 image by digest so a retag cannot
          # silently swap the live 4.7 job onto a different build.
          if [ "${{ matrix.netbox-version }}" = "v4.7.0-beta2" ]; then
            image="ghcr.io/netbox-community/netbox@sha256:b4c36c2ecbb161dad6557cec9f505e7dd7af0fee23f16f937f5585f440941467"
          fi
          token_key="ci1234567890"
          token="0123456789abcdef0123456789abcdef01234567"
          token_pepper="ci-token-pepper-for-testing-only-not-for-production-use-12345"

          if docker pull "$image"; then
            echo "Starting NetBox from $image"
            docker run -d \
              --name netbox-ci \
              --network host \
              -e SECRET_KEY="ci-secret-key-for-testing-only-not-for-production-use" \
              -e API_TOKEN_PEPPER_1="$token_pepper" \
              -e ALLOWED_HOSTS="*" \
              -e DB_HOST=127.0.0.1 \
              -e DB_PORT=5432 \
              -e DB_NAME=netbox \
              -e DB_USER=netbox \
              -e DB_PASSWORD=netbox \
              -e REDIS_HOST=127.0.0.1 \
              -e REDIS_PORT=6379 \
              -e SUPERUSER_NAME=admin \
              -e SUPERUSER_EMAIL=admin@example.com \
              -e SUPERUSER_PASSWORD=netbox-test-password \
              -e SUPERUSER_API_TOKEN="$token" \
              "$image"
            echo "NETBOX_CI_BACKEND=docker" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "${{ matrix.netbox-version }}" = "v4.7.0-beta2" ]; then
            echo "Pinned digest for v4.7.0-beta2 is unavailable; failing closed (no mutable tag fallback)"
            exit 1
          fi

          echo "Docker image $image is unavailable; falling back to source checkout"
          git clone --depth 1 --branch "${{ matrix.netbox-version }}" \
            https://github.com/netbox-community/netbox.git /tmp/netbox-source

          cat > /tmp/netbox-source/netbox/netbox/configuration.py <<'PY'
          ALLOWED_HOSTS = ['*']
          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.postgresql',
                  'NAME': 'netbox',
                  'USER': 'netbox',
                  'PASSWORD': 'netbox',
                  'HOST': '127.0.0.1',
                  'PORT': '5432',
                  'CONN_MAX_AGE': 300,
              }
          }
          REDIS = {
              'tasks': {
                  'HOST': '127.0.0.1',
                  'PORT': 6379,
                  'USERNAME': '',
                  'PASSWORD': '',
                  'DATABASE': 0,
                  'SSL': False,
              },
              'caching': {
                  'HOST': '127.0.0.1',
                  'PORT': 6379,
                  'USERNAME': '',
                  'PASSWORD': '',
                  'DATABASE': 1,
                  'SSL': False,
              },
          }
          SECRET_KEY = 'ci-secret-key-for-testing-only-not-for-production-use-12345'
          API_TOKEN_PEPPERS = {
              1: 'ci-token-pepper-for-testing-only-not-for-production-use-12345',
          }
          DEFAULT_PERMISSIONS = {}
          LOGGING = {'version': 1, 'disable_existing_loggers': True}
          RELEASE_CHECK_URL = None
          PY

          python3 -m venv /tmp/netbox-source-venv
          /tmp/netbox-source-venv/bin/python -m pip install --upgrade pip wheel
          /tmp/netbox-source-venv/bin/python -m pip install -r /tmp/netbox-source/requirements.txt
          /tmp/netbox-source-venv/bin/python /tmp/netbox-source/netbox/manage.py migrate --no-input
          /tmp/netbox-source-venv/bin/python /tmp/netbox-source/netbox/manage.py shell <<PY
          from users.choices import TokenVersionChoices
          from users.models import Token, User

          token_key = "$token_key"
          token = "$token"
          user, _ = User.objects.get_or_create(username="admin", defaults={"email": "admin@example.com"})
          user.email = "admin@example.com"
          user.is_staff = True
          user.is_superuser = True
          user.set_password("netbox-test-password")
          user.save()
          Token.objects.filter(user=user, description="CI live-test token").delete()
          Token.objects.filter(key=token_key).delete()
          Token.objects.create(
              user=user,
              description="CI live-test token",
              version=TokenVersionChoices.V2,
              key=token_key,
              token=token,
              write_enabled=True,
          )
          PY
          /tmp/netbox-source-venv/bin/python /tmp/netbox-source/netbox/manage.py runserver \
            0.0.0.0:8080 --insecure > /tmp/netbox-source.log 2>&1 &
          echo "$!" > /tmp/netbox-source.pid
          echo "NETBOX_CI_BACKEND=source" >> "$GITHUB_ENV"

      - name: Wait for NetBox to be ready
        run: |
          set -euo pipefail
          echo "Waiting for NetBox to be ready..."
          for i in $(seq 1 60); do
            code=$(curl -sS -o /tmp/netbox-ready-body -w "%{http_code}" \
              http://localhost:8080/ 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ] || [ "$code" = "403" ]; then
              echo "NetBox HTTP endpoint is ready with status $code"
              exit 0
            fi
            echo "  attempt $i/60 - not ready yet, sleeping 10s"
            sleep 10
          done
          echo "NetBox did not become ready"
          docker logs --tail 200 netbox-ci 2>/dev/null || true
          tail -n 200 /tmp/netbox-source.log 2>/dev/null || true
          exit 1

      - name: Ensure CI API token
        run: |
          set -euo pipefail

          token_key="ci1234567890"
          token_secret="0123456789abcdef0123456789abcdef01234567"
          token_script=$(mktemp)
          cat > "$token_script" <<PY
          from users.choices import TokenVersionChoices
          from users.models import Token, User

          token_key = "$token_key"
          token_secret = "$token_secret"
          user, _ = User.objects.get_or_create(username="admin", defaults={"email": "admin@example.com"})
          user.email = "admin@example.com"
          user.is_staff = True
          user.is_superuser = True
          user.set_password("netbox-test-password")
          user.save()
          Token.objects.filter(user=user, description="CI live-test token").delete()
          Token.objects.filter(key=token_key).delete()
          Token.objects.create(
              user=user,
              description="CI live-test token",
              version=TokenVersionChoices.V2,
              key=token_key,
              token=token_secret,
              write_enabled=True,
          )
          PY

          if [ "${NETBOX_CI_BACKEND:-}" = "docker" ]; then
            docker exec -i netbox-ci /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py shell < "$token_script"
          else
            /tmp/netbox-source-venv/bin/python /tmp/netbox-source/netbox/manage.py shell < "$token_script"
          fi

          auth="Bearer nbt_${token_key}.${token_secret}"
          status_code=$(curl -sS -o /tmp/netbox-status.json -w "%{http_code}" \
            -H "Authorization: $auth" http://localhost:8080/api/status/ || true)
          if [ "$status_code" != "200" ]; then
            echo "Authenticated /api/status/ check failed with HTTP $status_code"
            cat /tmp/netbox-status.json 2>/dev/null || true
            docker logs --tail 200 netbox-ci 2>/dev/null || true
            tail -n 200 /tmp/netbox-source.log 2>/dev/null || true
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys
          expected = os.environ["NETBOX_EXPECTED_VERSION"].removeprefix("v")
          reported = json.load(open("/tmp/netbox-status.json")).get("netbox-version")
          print(f"NetBox API status: {reported} (expected {expected})")
          if reported != expected:
              raise SystemExit(
                  f"Live job expected NetBox {expected}; /api/status/ reported {reported!r}"
              )
          PY

      - name: Set NetBox connection env vars
        run: |
          echo "NETBOX_TOKEN=nbt_ci1234567890.0123456789abcdef0123456789abcdef01234567" >> $GITHUB_ENV
          echo "NETBOX_TOKEN_KEY=ci1234567890" >> $GITHUB_ENV
          echo "NETBOX_TOKEN_SECRET=0123456789abcdef0123456789abcdef01234567" >> $GITHUB_ENV
          echo "NETBOX_URL=http://localhost:8080" >> $GITHUB_ENV

      # tests/test_branching_live.py auto-skips when ``netbox-branching`` is
      # not installed, so the live suite stays green on the stock image. The
      # matrix can opt into branching coverage by adding an install step
      # before this point in a follow-up that wires the plugin's
      # configuration.py requirements (DynamicSchemaDict, database router,
      # event pipeline) into the running container.

      - name: Run live NetBox integration tests
        env:
          NETBOX_URL: ${{ env.NETBOX_URL }}
          NETBOX_TOKEN: ${{ env.NETBOX_TOKEN }}
          NETBOX_TOKEN_KEY: ${{ env.NETBOX_TOKEN_KEY }}
          NETBOX_TOKEN_SECRET: ${{ env.NETBOX_TOKEN_SECRET }}
          NETBOX_LIVE_TEST: "1"
          NETBOX_EXPECTED_VERSION: ${{ matrix.netbox-version }}
        run: uv run pytest -v --tb=short -p no:randomly -m suite_sdk

      - name: Dump NetBox logs on failure
        if: failure()
        run: |
          docker logs --tail 200 netbox-ci 2>/dev/null || true
          tail -n 200 /tmp/netbox-source.log 2>/dev/null || true

      - name: Stop NetBox
        if: always()
        run: |
          if [ -f /tmp/netbox-source.pid ]; then
            kill "$(cat /tmp/netbox-source.pid)" 2>/dev/null || true
          fi
          docker rm -f netbox-ci 2>/dev/null || true
