name: Validate metadata provenance

on:
  push:
    branches: [main]
    paths:
      - metadata.json

permissions:
  contents: read

concurrency:
  group: validate-metadata-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-metadata:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the exact metadata commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Validate committed metadata against repository history
        run: |
          python - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path

          from scripts.build_metadata import validate_source_provenance

          root = Path.cwd()
          metadata = json.loads((root / "metadata.json").read_text(encoding="utf-8"))
          commit = metadata["source"]["commit"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("metadata source.commit must be a full lowercase Git SHA")
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))["project"]
          if metadata["release"] != project["version"]:
              raise SystemExit("metadata release does not match the project version")
          validate_source_provenance(commit, str(project["version"]))
          print(f"metadata.json is traceable to {commit}")
          PY
