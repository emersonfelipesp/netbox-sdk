name: Build Django Model Graphs

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build last 3 NetBox releases
    runs-on: ubuntu-latest

    steps:
      - name: Check out the exact read-only source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          version: "0.11.28"

      - name: Install the checked-out netbox-sdk tool
        run: uv tool install --force '.[cli]'

      - name: Get last 3 NetBox release tags
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags="$(gh api --method GET 'repos/netbox-community/netbox/releases?per_page=3' --jq '.[].tag_name')"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build model graphs
        env:
          TAGS: ${{ steps.releases.outputs.tags }}
        run: |
          set -euo pipefail
          build_dir="${RUNNER_TEMP:?}/django-model-builds"
          mkdir -p "$build_dir"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if ! [[ "$tag" =~ ^v[0-9][0-9A-Za-z.-]*$ ]]; then
              echo "Unexpected NetBox release tag: $tag" >&2
              exit 1
            fi
            checkout_dir="$(mktemp -d "${RUNNER_TEMP:?}/netbox-${tag}.XXXXXX")"
            git clone --depth 1 --branch "$tag" https://github.com/netbox-community/netbox.git "$checkout_dir"
            ~/.local/bin/nbx dev django-model build --rebuild \
              --netbox-root "$checkout_dir/netbox/" \
              --cache-path "$build_dir/${tag}-django-models-build.json"
          done <<< "$TAGS"

      - name: Upload model graphs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: django-model-graphs-${{ github.run_id }}
          path: ${{ runner.temp }}/django-model-builds/*.json
          if-no-files-found: error
          retention-days: 14
