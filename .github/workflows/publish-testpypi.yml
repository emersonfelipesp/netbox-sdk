name: Release validation and publish

on:
  push:
    tags:
      - "v*rc*"
  release:
    types: [published]

permissions:
  contents: read

env:
  CANONICAL_GITEA_URL: https://git.nmulti.cloud/emersonfelipesp/netbox-sdk.git
  CANONICAL_MAIN_REF: refs/remotes/gitea/release-policy-main
  IMMUTABLE_TAG_REF: refs/release-policy/gitea-v0.0.10
  IMMUTABLE_TAG_OBJECT: e104bdd554ac2becf7abd38b238d8fb5509651f4
  IMMUTABLE_TAG_COMMIT: 3bcc86481f60f0f2d6fb1913c42d1561f5d5b77e

jobs:
  release-preflight:
    name: release preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with immutable release history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"

      - name: Sync complete locked development environment
        run: |
          uv lock --check
          uv sync --dev --extra cli --extra tui --extra demo --extra mock --extra mcp --locked

      - name: Run ty type checks
        run: uv run ty check netbox_sdk netbox_cli netbox_tui netbox_mcp tests --output-format concise

      - name: Run pre-commit checks
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Run full test suite before any registry upload
        run: uv run pytest -v --tb=short -p no:randomly

  prepare-release:
    name: prepare artifacts + metadata
    needs: release-preflight
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.meta.outputs.package_name }}
      version: ${{ steps.meta.outputs.version }}
      publish_pypi: ${{ steps.meta.outputs.publish_pypi }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"

      - name: Sync the locked release toolchain
        run: uv sync --only-group publish --locked

      - name: Fetch canonical Gitea main and immutable release tag
        run: |
          git fetch --no-tags "$CANONICAL_GITEA_URL" \
            "+refs/heads/main:${CANONICAL_MAIN_REF}" \
            "+refs/tags/v0.0.10:${IMMUTABLE_TAG_REF}"

      - name: Validate package metadata, tag, and canonical-main ancestry
        id: meta
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: >-
          .venv/bin/python scripts/release_policy.py
          --expected-package netbox-sdk
          --event-name "$GITHUB_EVENT_NAME"
          --ref-name "$GITHUB_REF_NAME"
          --canonical-main-ref "$CANONICAL_MAIN_REF"
          --immutable-tag-ref "$IMMUTABLE_TAG_REF"
          --immutable-tag-object "$IMMUTABLE_TAG_OBJECT"
          --immutable-tag-commit "$IMMUTABLE_TAG_COMMIT"

      - name: Build distribution
        run: .venv/bin/python -m build --no-isolation

      - name: Check distribution metadata
        run: .venv/bin/python -m twine check dist/*

      - name: Validate the closed local artifact set
        env:
          PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: >-
          .venv/bin/python scripts/prepare_testpypi_upload.py
          --package "$PACKAGE_NAME"
          --version "$PACKAGE_VERSION"
          --dist-dir dist
          --validate-only

      - name: Capture the validated dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  smoke-built-wheel:
    name: smoke captured wheel
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Download the captured release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Smoke test the captured branching extra copy
        # The [branching] extra is a marker today (no extra runtime deps), but
        # we verify it resolves and imports from a downstream artifact copy.
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          entries=(dist/*)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "${#entries[@]}" -eq 2
          python -m venv "${RUNNER_TEMP}/branching-smoke"
          "${RUNNER_TEMP}/branching-smoke/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/branching-smoke/bin/python" -m pip install "${wheels[0]}[branching]"
          "${RUNNER_TEMP}/branching-smoke/bin/python" -c "import netbox_sdk.branching; print('branching ok:', netbox_sdk.branching.BranchingClient.__name__)"

  publish-testpypi:
    name: publish to TestPyPI
    needs: [prepare-release, smoke-built-wheel]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release verification code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
          version: "0.11.28"

      - name: Sync the locked publisher toolchain
        run: uv sync --only-group publish --locked

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Verify existing TestPyPI artifacts or select missing files
        id: registry
        env:
          PACKAGE_NAME: ${{ needs.prepare-release.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: >-
          .venv/bin/python scripts/prepare_testpypi_upload.py
          --package "$PACKAGE_NAME"
          --version "$PACKAGE_VERSION"
          --dist-dir dist
          --upload-dir "${RUNNER_TEMP}/dist-upload"

      - name: Upload to TestPyPI
        if: steps.registry.outputs.upload_required == 'true'
        env:
          PACKAGE_NAME: ${{ needs.prepare-release.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.version }}
          TEST_PYPI_USERNAME: ${{ secrets.TEST_PYPI_USERNAME }}
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/prepare_testpypi_upload.py \
            --package "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION" \
            --dist-dir dist \
            --upload-dir "${RUNNER_TEMP}/dist-upload" \
            --verify-upload-dir
          .venv/bin/python -m twine upload \
            --non-interactive \
            --repository-url https://test.pypi.org/legacy/ \
            --username "$TEST_PYPI_USERNAME" \
            --password "$TEST_PYPI_TOKEN" \
            "${RUNNER_TEMP}"/dist-upload/*

  validate-testpypi:
    name: validate TestPyPI / py${{ matrix.python-version }}
    needs: [prepare-release, publish-testpypi]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.28"

      - name: Sync the locked registry verifier
        run: uv sync --only-group publish --locked

      - name: Download the exact locally-built release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Verify TestPyPI hashes and resolve the uploaded wheel
        id: registry
        env:
          PACKAGE_NAME: ${{ needs.prepare-release.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: >-
          .venv/bin/python scripts/prepare_testpypi_upload.py
          --package "$PACKAGE_NAME"
          --version "$PACKAGE_VERSION"
          --dist-dir dist
          --upload-dir "${RUNNER_TEMP}/unexpected-missing-${{ matrix.python-version }}"
          --require-published

      - name: Install and smoke the exact TestPyPI wheel
        env:
          EXPECTED_VERSION: ${{ needs.prepare-release.outputs.version }}
          WHEEL_URL: ${{ steps.registry.outputs.wheel_url }}
        run: |
          set -euo pipefail
          test -n "$WHEEL_URL"
          smoke_dir="${RUNNER_TEMP}/testpypi-smoke-${{ matrix.python-version }}"
          uv venv --python "${{ matrix.python-version }}" "$smoke_dir"
          uv pip install \
            --python "$smoke_dir/bin/python" \
            --index-url https://pypi.org/simple/ \
            "netbox-sdk[all] @ ${WHEEL_URL}"
          cd "$RUNNER_TEMP"
          EXPECTED_VERSION="$EXPECTED_VERSION" "$smoke_dir/bin/python" - <<'PY'
          import importlib.metadata
          import os

          import netbox_cli
          import netbox_mcp
          import netbox_sdk
          import netbox_tui

          expected = os.environ["EXPECTED_VERSION"]
          assert importlib.metadata.version("netbox-sdk") == expected
          assert netbox_sdk.__version__ == expected
          assert netbox_cli.main
          assert netbox_mcp.create_mcp_server
          assert netbox_tui.__package__ == "netbox_tui"
          PY

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --extra mcp --locked

      - name: Run ty type checks (3.13 only)
        if: matrix.python-version == '3.13'
        run: uv run ty check netbox_sdk netbox_cli netbox_tui netbox_mcp tests --output-format concise

      - name: Run pre-commit checks (3.13 only)
        if: matrix.python-version == '3.13'
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Run full test suite
        run: uv run pytest -v --tb=short

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'release' && needs.prepare-release.outputs.publish_pypi == 'true'
    needs: [prepare-release, validate-testpypi]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release verification code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false
          version: "0.11.28"

      - name: Sync the locked publisher toolchain
        run: uv sync --only-group publish --locked

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Revalidate canonical Gitea and the exact TestPyPI artifact set
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name || github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PACKAGE_NAME: ${{ needs.prepare-release.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags "$CANONICAL_GITEA_URL" \
            "+refs/heads/main:${CANONICAL_MAIN_REF}" \
            "+refs/tags/v0.0.10:${IMMUTABLE_TAG_REF}"
          .venv/bin/python scripts/release_policy.py \
            --expected-package netbox-sdk \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref-name "$GITHUB_REF_NAME" \
            --canonical-main-ref "$CANONICAL_MAIN_REF" \
            --immutable-tag-ref "$IMMUTABLE_TAG_REF" \
            --immutable-tag-object "$IMMUTABLE_TAG_OBJECT" \
            --immutable-tag-commit "$IMMUTABLE_TAG_COMMIT"
          .venv/bin/python scripts/prepare_testpypi_upload.py \
            --package "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION" \
            --dist-dir dist \
            --upload-dir "${RUNNER_TEMP}/unexpected-testpypi-missing" \
            --require-published

      - name: Select exact missing PyPI artifacts
        id: pypi-registry
        env:
          PACKAGE_NAME: ${{ needs.prepare-release.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: >-
          .venv/bin/python scripts/prepare_testpypi_upload.py
          --package "$PACKAGE_NAME"
          --version "$PACKAGE_VERSION"
          --dist-dir dist
          --upload-dir "${RUNNER_TEMP}/pypi-upload"
          --registry pypi

      - name: Upload to PyPI
        if: steps.pypi-registry.outputs.upload_required == 'true'
        env:
          PACKAGE_NAME: ${{ needs.prepare-release.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.version }}
          PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          set -euo pipefail
          .venv/bin/python scripts/prepare_testpypi_upload.py \
            --package "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION" \
            --dist-dir dist \
            --upload-dir "${RUNNER_TEMP}/pypi-upload" \
            --verify-upload-dir
          .venv/bin/python -m twine upload \
            --non-interactive \
            --repository-url https://upload.pypi.org/legacy/ \
            --username "$PYPI_USERNAME" \
            --password "$PYPI_TOKEN" \
            "${RUNNER_TEMP}"/pypi-upload/*

      - name: Verify exact published PyPI artifact set
        env:
          PACKAGE_NAME: ${{ needs.prepare-release.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if .venv/bin/python scripts/prepare_testpypi_upload.py \
              --package "$PACKAGE_NAME" \
              --version "$PACKAGE_VERSION" \
              --dist-dir dist \
              --upload-dir "${RUNNER_TEMP}/verified-pypi-${attempt}" \
              --registry pypi \
              --require-published; then
              exit 0
            fi
            if test "$attempt" -eq 6; then
              exit 1
            fi
            sleep 10
          done
